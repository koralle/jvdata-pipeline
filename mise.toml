# 開発ツール
#
# - cargo-nextest / cargo-machete / cargo-deny は
#   .github/workflows/ci.yaml の tool: 指定と同じバージョンに揃える
# - Rust 本体 (rustfmt / clippy 込み) は rust-toolchain.toml で管理している
[tools]
"cargo:cargo-nextest" = "0.9.144"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"

# Git フック
"npm:lefthook" = "2.1.12"

# 環境変数 / シークレットの検証と注入 (.env.schema)
"npm:varlock" = "1.19.0"

# 開発環境をセットアップする (ツール導入 + Git フック有効化)
[tasks.setup]
description = "開発環境をセットアップする"
# 初回は lefthook がまだ PATH にないため mise exec で再解決する
run = "mise install && mise exec -- lefthook install"

# フォーマット
[tasks.fmt]
description = "コードを整形する"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "フォーマットをチェックする"
run = "cargo fmt --all -- --check"

# Lint
[tasks.clippy]
description = "Clippy で lint する"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

# テスト
[tasks.test]
description = "テストを実行する (nextest)"
run = "cargo nextest run --workspace --all-features"

[tasks.test-doc]
description = "doc テストを実行する"
run = "cargo test --doc --workspace --all-features"

# store/tests/*_db.rs の PostgreSQL 統合テスト。開発 DB (mise run up) が
# 起動済みであること。compose は DB を 127.0.0.1:5432 に出しているので
# ホスト側はそこへ繋ぐ (.env の POSTGRES_HOST=postgres はコンテナ内専用)。
# DATABASE_URL は .env の POSTGRES_* から組み立てる
# (テストは migration を含むので管理用の jvdata ロールで繋ぐ)。
[tasks."test-db"]
description = "PostgreSQL 統合テストを実行する (開発 DB が起動済みであること)"
depends = ["env:init"]
run = """
varlock run -- sh -c 'DATABASE_URL="postgresql://jvdata:$POSTGRES_PASSWORD@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-jvdata}" \
  cargo nextest run -p store --all-features'
"""

# 依存クレート
[tasks.machete]
description = "未使用クレートを検出する"
run = "cargo machete"

[tasks.deny]
description = "依存クレートのポリシー (脆弱性 / ライセンス) をチェックする"
run = "cargo deny --all-features --locked check"

# まとめ
[tasks.check]
description = "フォーマットと Clippy をチェックする (pre-commit)"
depends = ["fmt-check", "clippy"]

[tasks.ci]
description = "CI と同じチェックをまとめて実行する (直列: mise run -j 1 ci)"
depends = ["fmt-check", "clippy", "test", "test-doc", "machete", "deny"]

# 開発用コンテナ
#
# 資格情報は compose.yaml に直書きせず、varlock が .env.schema に従って注入する。
# compose 側は未設定の変数で落ちるので、docker compose はここ経由で叩く。
[tasks.up]
description = "開発用コンテナ一式を起動する"
# 初回は .env を作ってから起動する

# UI は tailnet の IP に出す (loopback には出さない)。他のマシンからも、この
# マシン自身からも https://$TS_FQDN:<ポート> で開く。tailnet IP は tailscale
# から取る。Tailscale が動いていなければ loopback だけになる。
depends = ["env:init"]
run = """
if [ ! -f docker/tls/tls.key ]; then
  echo "docker/tls に証明書が無い。先に mise run cert を叩く (UI が HTTPS で起動しない)" >&2
fi
TS_BIND_ADDR=$(tailscale ip -4 2>/dev/null | head -1) \
  varlock run -- docker compose up -d
"""

# UI 用の TLS 証明書。Tailscale が切った証明書 (90 日) をそのままサービスに渡す。
# 期限が近づいたら叩き直す (cron にするなら月に一度これ)。
[tasks.cert]
description = "Tailscale の証明書を docker/tls に取得し直す"
run = """
mkdir -p docker/tls
# 証明書は root が取ってくる。コンテナ内の UID (grafana 472 / prometheus の
# nobody / pgadmin 5050) はばらばらでグループにまとめられないので、読める
# 権限まで root のうちに付ける。
varlock run -- sh -c 'sudo sh -c "tailscale cert --cert-file=docker/tls/tls.crt --key-file=docker/tls/tls.key $TS_FQDN && chmod 644 docker/tls/tls.crt docker/tls/tls.key"'
# 証明書は起動時に読まれるので、入れ替えたら 3 つを立て直す。
# rootless docker では restart だとポート公開が張り直されない (listen しなくなる)
# ので recreate する。そのとき tailnet IP を渡し直さないと loopback に戻る。
TS_BIND_ADDR=$(tailscale ip -4 2>/dev/null | head -1) \
  varlock run -- docker compose up -d --force-recreate prometheus grafana pgadmin
"""

[tasks."env:init"]
description = "開発用の .env を作る (既にあれば触らない)"
run = """
if [ ! -f .env ]; then
  umask 077
  {
    printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'POSTGRES_LOADER_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'POSTGRES_METRICS_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'GF_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'PGADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)"
  } > .env
  echo ".env を作成しました (開発機用のランダムな値。git 管理外)"
fi
"""

[tasks.down]
description = "開発用コンテナ一式を停止する"
run = "varlock run -- docker compose down"

[tasks.psql]
description = "psql で開発用 DB に繋ぐ"
run = "varlock run -- docker compose exec dbtools psql"

[tasks.pgcli]
description = "pgcli で開発用 DB に繋ぐ"
run = "varlock run -- docker compose exec dbtools pgcli"

[tasks.logs]
description = "コンテナのログを見る"
run = "varlock run -- docker compose logs -f"

# compose ファイルの検証。YAML として読めるか、compose のスキーマに合うか、
# 変数が解決できるかを見る (行の長さなどの見た目は yamllint の仕事)。
# 起動も停止もしないので、設定を変えた後・反映する前に叩く。
# 資格情報を要求するので、CI や .env の無い clone では動かない。
[tasks."compose:check"]
description = "compose.yaml を検証する (開発用。起動しない)"
run = "varlock run -- docker compose config -q"

# 本番用コンテナ
#
# 開発用とは別プロジェクト・別ディレクトリで、別の .env.schema / .env を使う。
# dir で必ず deploy/production に入ってから実行する。root で
# `varlock run -- docker compose -f deploy/production/compose.yaml ...` と叩くと
# 開発用の .env が環境変数として注入され、それが本番の .env に勝つ。本番 DB は
# 初回起動時のパスワードで初期化されるので、後から直そうとしても直らない。
# 準備と手順は deploy/production/README.md。
#
# 本番ホストで mise から叩くときは MISE_TASK_RUN_AUTO_INSTALL=false を付ける。
# root の mise.toml は開発ツール (Rust / nextest など) も宣言しているため、既定の
# ままだとそれらを本番ホストに入れにいく。
[tasks."prod:up"]
description = "本番用コンテナを起動する (deploy/production)"
dir = "deploy/production"
run = "varlock run -- docker compose up -d"

[tasks."prod:check"]
description = "本番用 compose を検証する (起動しない)"
dir = "deploy/production"
run = "varlock run -- docker compose config -q"

[tasks."prod:down"]
description = "本番用コンテナを停止する"
dir = "deploy/production"
run = "varlock run -- docker compose down"

[tasks."prod:psql"]
description = "psql で本番 DB に繋ぐ"
dir = "deploy/production"
run = "varlock run -- docker compose exec dbtools psql"

[tasks."prod:pgcli"]
description = "pgcli で本番 DB に繋ぐ"
dir = "deploy/production"
run = "varlock run -- docker compose exec dbtools pgcli"

[tasks."prod:logs"]
description = "本番コンテナのログを見る"
dir = "deploy/production"
run = "varlock run -- docker compose logs -f"
