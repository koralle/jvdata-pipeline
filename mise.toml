# 開発ツール
#
# - cargo-nextest / cargo-machete / cargo-deny は
#   .github/workflows/ci.yaml の tool: 指定と同じバージョンに揃える
# - Rust 本体 (rustfmt / clippy 込み) は rust-toolchain.toml で管理している
[tools]
"cargo:cargo-nextest" = "0.9.144"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"

# Git フック
"npm:lefthook" = "2.1.12"

# 環境変数 / シークレットの検証と注入 (.env.schema)
"npm:varlock" = "1.19.0"

# 開発環境をセットアップする (ツール導入 + Git フック有効化)
[tasks.setup]
description = "開発環境をセットアップする"
# 初回は lefthook がまだ PATH にないため mise exec で再解決する
run = "mise install && mise exec -- lefthook install"

# フォーマット
[tasks.fmt]
description = "コードを整形する"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "フォーマットをチェックする"
run = "cargo fmt --all -- --check"

# Lint
[tasks.clippy]
description = "Clippy で lint する"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

# テスト
[tasks.test]
description = "テストを実行する (nextest)"
run = "cargo nextest run --workspace --all-features"

[tasks.test-doc]
description = "doc テストを実行する"
run = "cargo test --doc --workspace --all-features"

# 依存クレート
[tasks.machete]
description = "未使用クレートを検出する"
run = "cargo machete"

[tasks.deny]
description = "依存クレートのポリシー (脆弱性 / ライセンス) をチェックする"
run = "cargo deny --all-features --locked check"

# まとめ
[tasks.check]
description = "フォーマットと Clippy をチェックする (pre-commit)"
depends = ["fmt-check", "clippy"]

[tasks.ci]
description = "CI と同じチェックをまとめて実行する (直列: mise run -j 1 ci)"
depends = ["fmt-check", "clippy", "test", "test-doc", "machete", "deny"]

# 開発用コンテナ
#
# 資格情報は compose.yaml に直書きせず、varlock が .env.schema に従って注入する。
# compose 側は未設定の変数で落ちるので、docker compose はここ経由で叩く。
[tasks.up]
description = "開発用コンテナ一式を起動する"
# 初回は .env を作ってから起動する

depends = ["env:init"]
run = "varlock run -- docker compose up -d"

[tasks."env:init"]
description = "開発用の .env を作る (既にあれば触らない)"
run = """
if [ ! -f .env ]; then
  umask 077
  {
    printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'POSTGRES_LOADER_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'POSTGRES_METRICS_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'GF_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)"
    printf 'PGADMIN_PASSWORD=%s\n' "$(openssl rand -hex 16)"
  } > .env
  echo ".env を作成しました (開発機用のランダムな値。git 管理外)"
fi
"""

[tasks.down]
description = "開発用コンテナ一式を停止する"
run = "varlock run -- docker compose down"

[tasks.psql]
description = "psql で開発用 DB に繋ぐ"
run = "varlock run -- docker compose exec dbtools psql"

[tasks.pgcli]
description = "pgcli で開発用 DB に繋ぐ"
run = "varlock run -- docker compose exec dbtools pgcli"

[tasks.logs]
description = "コンテナのログを見る"
run = "varlock run -- docker compose logs -f"
