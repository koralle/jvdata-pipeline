pre-commit:
  commands:
    check:
      run: mise run check
      fail_text: "Rust のフォーマットまたは Clippy のチェックに失敗しました。"
    machete:
      run: mise run machete
      fail_text: "未使用クレートの検出 (cargo-machete) に失敗しました。"

pre-push:
  commands:
    test:
      run: mise run test
      fail_text: "Rust のテストに失敗しました。"
    deny:
      run: mise run deny
      fail_text: "依存クレートのポリシーチェック (cargo-deny) に失敗しました。"
