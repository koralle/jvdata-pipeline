[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition ="2024"
rust-version = "1.98"

[workspace.dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "time"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
clap = { version = "4.5", features = ["derive", "env"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
encoding_rs = "0.8"
sha2 = "0.10"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
