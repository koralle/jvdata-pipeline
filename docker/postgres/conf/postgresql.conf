# PostgreSQL 18 の設定。compose.yaml から config_file として読ませる。
#
# データディレクトリ側の postgresql.conf は initdb が作るが使われない。
# ALTER SYSTEM の postgresql.auto.conf はデータディレクトリ側で従来どおり動く。
# 値を変えたら反映する: docker compose restart postgres
# 根拠と調整方法: docs/postgres-operations.md

# --- ファイルの場所 ---------------------------------------------------------
# config_file をデータディレクトリの外に置くと、相対パスの既定値が追随しない。
# 認証ファイルはデータディレクトリ側のものを指す。
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# --- 接続 -------------------------------------------------------------------
listen_addresses = '*'
max_connections = 100			# 監視と蓄積で足りなくなったら上げる (要再起動)

# --- メモリ -----------------------------------------------------------------
# 開発機向けの初期値。蓄積の負荷を見てから上げる。
shared_buffers = 256MB			# ホスト RAM の 25% 目安 (要再起動)
work_mem = 16MB				# ソート/ハッシュ 1 回あたり。EXPLAIN の actual rows を見て決める
maintenance_work_mem = 128MB		# VACUUM / CREATE INDEX 用
effective_cache_size = 1GB		# プランナへの「OS キャッシュ込みでこれくらい」の申告

# --- WAL / チェックポイント -------------------------------------------------
# 大量 INSERT では既定 (max_wal_size = 1GB) だとチェックポイントが頻発する。
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min

# --- 統計 / 監視 ------------------------------------------------------------
# pg_stat_statements は shared_preload_libraries で読み込む (要再起動)。
# 拡張自体は init スクリプトで CREATE EXTENSION している。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
# I/O の内訳を取る (pg_stat_statements の I/O 列、pg_stat_io、EXPLAIN の BUFFERS)
track_io_timing = on
track_wal_io_timing = on

# --- 自動 vacuum ------------------------------------------------------------
# 大量蓄積では既定のスケール係数 (0.2 / 0.1) だと vacuum が遅れる。
# テーブル単位で上書きもできる:
#   ALTER TABLE ... SET (autovacuum_vacuum_scale_factor = 0.02);
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# --- ログ -------------------------------------------------------------------
# ログは stderr に出す (docker compose logs postgres)。
log_min_duration_statement = 500ms	# 遅いクエリの記録。性能調査の入口
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_autovacuum_min_duration = 0		# 0 = autovacuum の実行を全部記録
log_lock_waits = on
log_temp_files = 0			# 0 = 一時ファイルを使ったクエリを全部記録
log_disconnections = on

# --- ロケール / 表示 --------------------------------------------------------
# Alpine (musl) にはロケールデータが無く lc_time が効かないため Debian 版を使う。
timezone = 'Asia/Tokyo'
log_timezone = 'Asia/Tokyo'
datestyle = 'ISO, YMD'			# 1/2/2025 のような曖昧な入力を米国式に解釈させない
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'ja_JP.UTF-8'			# to_char の TMMonth / TMDay を日本語にする
default_text_search_config = 'pg_catalog.english'
