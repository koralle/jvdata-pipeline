# 本番の認証設定。
#
# postgresql.local.conf の hba_file から読まれる (イメージが PGDATA に生成する
# pg_hba.conf は使わない)。上に書いた行が優先される。
#
# 変更したら: varlock run -- docker compose exec postgres pg_ctl reload -D $PGDATA
# (ラッパーが無いので、常用は restart で構わない)

# コンテナ内のローカル接続 (init スクリプト、docker compose exec psql)
local   all             all                                     trust

# TCP は送信元を問わずパスワード必須 (コンテナ内の loopback も含む)
host    all             all             all                     scram-sha-256

# pg_basebackup 用 (backup サービス)。replication は catch-all では通らないので明示する。
local   replication     all                                     trust
host    replication     jvdata          all                     scram-sha-256
