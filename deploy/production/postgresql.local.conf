# 本番ホスト固有の上書き。
#
# docker/postgres/conf/postgresql.conf (全ホスト共通の設定) から
# include_if_exists で読み込まれる。同じ設定を書いた場合はこちらが勝つ。
#
# 値はホストの RAM と蓄積量に合わせて決めること。目安:
#
#   shared_buffers        RAM の 25%
#   effective_cache_size  RAM の 50〜75%
#   maintenance_work_mem  VACUUM / CREATE INDEX 用。512MB〜1GB
#   work_mem              ソート/ハッシュ用。接続数ぶん食う点に注意
#
# 変更したら: varlock run -- docker compose restart postgres
# 効果は Grafana のダッシュボードで確認する (docs/postgres-operations.md)。

# --- メモリ (RAM 8GB のホストの例) ---
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB

# --- 認証 ---------------------------------------------------------------
# リポジトリ側のファイルを使う (イメージが PGDATA に生成するものは使わない)。
# pg_basebackup 用の replication ルールを明示するため。
# ident_file は共通設定のまま (PGDATA 側)。
hba_file = '/etc/postgresql/pg_hba.conf'

# --- WAL アーカイブ (PITR 用) ---
#
# ponytail: cp するだけ。圧縮は無いので、量が増えたら pgBackRest / wal-g に
# 置き換える。世代管理は backup.sh が pg_archivecleanup で行う (残っている
# 最古のベースバックアップより前の分を消す)。アーカイブ先は同じホストの
# ボリュームなので、別ホストへの退避は別途必要 (README 参照)。
# ここが埋まると DB も止まる。
archive_mode = on
archive_timeout = 15min
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'

# --- ログ ---
# 本番は遅いクエリだけ (開発用より閾値を上げる)
log_min_duration_statement = 1s
log_connections = on
log_disconnections = on
